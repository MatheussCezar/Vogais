<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <title>Vogais</title>
</head>

<body>
    <div class="titulo"><img src="./imagens/tela/titulo.png" alt="Vogais"></div>
    <div class="question">
        <button onclick="mostrarTutoras()"><img src="./imagens/tela/ajuda.png" alt=""></button>
    </div>
    <div id="areaJogavel"></div>
    <div id="ajuda">
        <button onclick="fecharTutoras()" id="fecharTutoras">X</button>
        <video id="videoTutorial" width="700px" controls style="margin-top: 100px; border-radius: 10px;">
            <source src="tutorial.mp4" type="video/mp4">
        </video>
    </div>
    <footer>
        <div id="start" onclick="restart()"></div>
        <div id="pause"></div>
    </footer>

    <div id="tabelaDeAcertos" class="hidden" style="color: white; font-size: 40px;">
        
    </div>
    <script src="script.js"></script>
</body>

</html>
