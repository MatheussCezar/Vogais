<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <title>Vogais</title>
</head>

<body>
    <div class="titulo"><img src="./imagens/tela/titulo.png" alt="Vogais"></div>
    <div class="question">
        <button onclick="mostrarTutoras()"><img src="./imagens/tela/ajuda.png" alt=""></button>
    </div>
    <div id="areaJogavel"></div>
    <div id="ajuda">
        <button onclick="fecharTutoras()" id="fecharTutoras">X</button>
        <video id="videoTutorial"controls>
            <source src="tutorial.mp4" type="video/mp4">
        </video>
    </div>
    <footer>
        <div id="start" onclick="restart()"></div>
    </footer>

    <div id="tabelaDeAcertos" class="hidden" style="color: white; font-size: 40px;">
        <p id="porcentagemAcerto"></p>
        <p id="emojis"></p>
    </div>

    <audio src="./sons/success.mp3" id="acerto"></audio>
    <audio src="./sons/mistake.mp3" id="erro"></audio>
    <script src="script.js"></script>
</body>

</html>
